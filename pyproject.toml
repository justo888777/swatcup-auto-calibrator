[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swatcup-auto-calibrator"
version = "1.4.0"
description = "Adaptive multi-site SWAT-CUP SUFI2 calibration with process diagnostics, structural audits, and native GUI delivery validation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "SWAT-CUP Auto Calibrator contributors"}
]
keywords = ["SWAT", "SWAT-CUP", "SUFI2", "calibration", "hydrology", "sediment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Hydrology",
]

[project.scripts]
swatcup-auto = "swatcup_auto.runner:main"

[project.optional-dependencies]
ppu = ["numpy>=1.24", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["swatcup_auto*"]
